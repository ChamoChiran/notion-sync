[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notion-sync"
version = "0.3.1"
description = "Read and update Notion pages from Markdown files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
notion-sync = "notion_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
